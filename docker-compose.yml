services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-kestrel}
      POSTGRES_USER: ${DB_USER:-kestrel}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kestrel} -d ${DB_NAME:-kestrel}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kestrel_net
    # On a 1GB VPS, cap postgres so it can't starve the daemon under load.
    mem_limit: 256m
    cpus: 0.6

  kestrel:
    build: .
    image: kestrel-kestrel:${KESTREL_TAG:-latest}
    env_file: .env
    environment:
      # Override so the app connects to the postgres service, not localhost.
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Live-reload params/bots config without rebuilding the image.
      - ./params.json:/app/params.json:ro
      - ./bots.json:/app/bots.json:ro
    networks:
      - kestrel_net
    # Resource ceiling so a runaway daemon can't OOM the box.
    mem_limit: 320m
    cpus: 0.6
    # Watchdog: query heartbeats table; if no row updated in the last 90s the
    # daemon has hung — Docker restarts it (restart: unless-stopped). The
    # heartbeat scheduler in src/engine/scheduler.py writes every 30s, so
    # 90s is 3× the cadence — enough slack for one missed write plus a tick.
    healthcheck:
      test:
        - CMD-SHELL
        - "PGPASSWORD=$$DB_PASSWORD psql -h postgres -U $$DB_USER -d $$DB_NAME -tAc \"SELECT (EXTRACT(EPOCH FROM NOW())*1000)::BIGINT - MAX(ts) < 90000 FROM heartbeats\" 2>/dev/null | grep -q ^t || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      # Give the daemon 90s to write its first heartbeat after a cold start.
      start_period: 90s

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://kestrel.casava.space"
      # Passed through to provisioning templates so the datasource can
      # reach postgres with the same credentials as the daemon.
      DB_NAME: ${DB_NAME:-kestrel}
      DB_USER: ${DB_USER:-kestrel}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - kestrel_net
    mem_limit: 256m
    cpus: 0.4

  # Postgres backup sidecar — daily pg_dump to ./backups/ with 7-day rotation.
  # First dump runs on startup so we never have an empty backup directory.
  pg-backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${DB_USER:-kestrel}
      PG_DB: ${DB_NAME:-kestrel}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_KEEP: "7"
      BACKUP_HOUR: "3"
    restart: unless-stopped
    volumes:
      - ./backups:/backups
      - ./infra/backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    networks:
      - kestrel_net
    mem_limit: 64m
    cpus: 0.1

  # ── Phase-2 STAGING (profile: staging) ──────────────────────────────────────
  # Curated best-performers pool (ENV=staging). Was its own `kestrel-staging`
  # compose project; folded into THIS project (2026-06-28, owner) so the whole
  # Kestrel stack shows as ONE group in Docker. Same kestrel image; rows isolated
  # by env='staging' + the `staging-` bot_id prefix (§19). STAGING_ENGINE=sim
  # until BingX VST keys exist (paper, no real money). Gated behind the `staging`
  # profile, so a plain dev `docker compose up -d` does NOT start it; bring it up
  # explicitly:  docker compose --profile staging up -d staging
  staging:
    image: kestrel-kestrel:${KESTREL_TAG:-latest}
    profiles: ["staging"]
    env_file: .env.staging
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./bots.staging.json:/app/bots.json:ro
      - ./params.json:/app/params.json:ro
    networks:
      - kestrel_net
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    # Heartbeat watchdog scoped to staging bots only (shared heartbeats table).
    healthcheck:
      test:
        - CMD-SHELL
        - "PGPASSWORD=$$DB_PASSWORD psql -h postgres -U $$DB_USER -d $$DB_NAME -tAc \"SELECT (EXTRACT(EPOCH FROM NOW())*1000)::BIGINT - MAX(ts) < 90000 FROM heartbeats WHERE bot_id LIKE 'staging-%'\" 2>/dev/null | grep -q ^t || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── OWNER LAB sandbox (profile: lab) ─────────────────────────────────────────
  # The fleet the OWNER hand-picks via scripts/lab.py (catalog → add → deploy).
  # Was its own `kestrel-lab` compose project; folded into THIS project so it
  # groups with the rest of the stack. ALWAYS paper (ENV=lab → SimulationExecution,
  # never a venue). Rows isolated by env='lab' + the `lab-` bot_id prefix. Gated
  # behind the `lab` profile (a dev `up` won't start it); scripts/lab.py drives it.
  lab:
    image: kestrel-kestrel:${KESTREL_TAG:-latest}
    profiles: ["lab"]
    env_file: .env.lab
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./bots.lab.json:/app/bots.json:ro
      - ./params.json:/app/params.json:ro
    networks:
      - kestrel_net
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    # Heartbeat watchdog scoped to lab bots only (shared heartbeats table).
    healthcheck:
      test:
        - CMD-SHELL
        - "PGPASSWORD=$$DB_PASSWORD psql -h postgres -U $$DB_USER -d $$DB_NAME -tAc \"SELECT (EXTRACT(EPOCH FROM NOW())*1000)::BIGINT - MAX(ts) < 90000 FROM heartbeats WHERE bot_id LIKE 'lab-%'\" 2>/dev/null | grep -q ^t || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  kestrel_net:
    name: kestrel_net

volumes:
  pgdata:
  grafana_data:
