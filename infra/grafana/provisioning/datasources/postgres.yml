apiVersion: 1

datasources:
  - name: KestrelDB
    uid: kestrel-db
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${DB_NAME}
    user: ${DB_USER}
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
