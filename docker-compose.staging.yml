# ── Phase 2: STAGING (quarantine) ───────────────────────────────────────────
# A SEPARATE compose project that runs a small curated set of bots against a
# DEMO/TESTNET venue (BingX VST = virtual USDT). Real matching engine, real
# fills/latency/rejections — virtual money, zero financial risk. This is the
# bridge between Phase 1 labs (SimulationExecution, modeled fills) and Phase 3
# prod (real capital). It satisfies the §18 criterion "testnet paper trading"
# and lets us measure simulated-vs-real fill deviation (<15% target).
#
# Runs as its OWN compose project so it never disturbs the running labs stack.
# It attaches to the existing external `kestrel_net` and shares the labs
# postgres; staging rows are isolated by env='staging' + `staging-` bot_id
# prefix (every table carries env + bot_id — §19), so Grafana can split phases.
#
# Bring up (after creating .env.staging + bots.staging.json — see below):
#   docker compose -p kestrel-staging -f docker-compose.staging.yml up -d --build
# Logs / status:
#   docker compose -p kestrel-staging -f docker-compose.staging.yml logs -f
# Tear down (closes positions via SIGTERM, then exits):
#   docker compose -p kestrel-staging -f docker-compose.staging.yml down
#
# Prerequisites (your steps — agent cannot create credentials):
#   1. BingX → create a DEMO (VST) account → API key with read+trade.
#   2. cp .env.staging.example .env.staging  → fill BingX VST key/secret +
#      the SAME DB_* creds as the labs .env (shared postgres).
#   3. Generate the curated fleet:
#        docker compose exec -T kestrel python3 scripts/promote_to_staging.py \
#          --stdout > bots.staging.json
services:
  kestrel-staging:
    build: .
    # Reuse the labs-built image when present; same src → same image.
    image: kestrel-kestrel:${KESTREL_TAG:-latest}
    env_file: .env.staging
    environment:
      # Reach the shared labs postgres over kestrel_net (service name).
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      # Staging runs its own curated fleet at the same in-container path the
      # daemon reads. params.json is shared (strategy params are env-agnostic).
      - ./bots.staging.json:/app/bots.json:ro
      - ./params.json:/app/params.json:ro
    networks:
      - kestrel_net
    restart: unless-stopped
    # Quarantine is a handful of bots, not a fleet — modest ceiling.
    mem_limit: 512m
    cpus: 1.0
    # Heartbeat watchdog scoped to staging bots only (the labs project has its
    # own heartbeats in the same table; scope by the staging- bot_id prefix).
    healthcheck:
      test:
        - CMD-SHELL
        - "PGPASSWORD=$$DB_PASSWORD psql -h postgres -U $$DB_USER -d $$DB_NAME -tAc \"SELECT (EXTRACT(EPOCH FROM NOW())*1000)::BIGINT - MAX(ts) < 90000 FROM heartbeats WHERE bot_id LIKE 'staging-%'\" 2>/dev/null | grep -q ^t || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

# The labs stack created this network (name: kestrel_net). Staging joins it as
# an external network so the two projects share one postgres without coupling
# their lifecycles.
networks:
  kestrel_net:
    external: true
    name: kestrel_net
